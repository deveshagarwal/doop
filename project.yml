name: Baseline
options:
  bundleIdPrefix: com.dagarwal
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: 2

targets:
  Baseline:
    type: application
    platform: iOS
    dependencies:
      - target: BaselineWidget
    sources:
      - path: App
      - path: Shared
      - path: Core
        excludes: [Package.swift, .build]
    entitlements:
      path: App/Baseline.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.dagarwal.baseline]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Baseline
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "Baseline reads the sleep, heart rate, workouts and vitals your Fitbit shares through Google Health, plus weight from Omada and meals from Nourish, to score your recovery on this phone."
        NSHealthUpdateUsageDescription: "Baseline does not write to Apple Health."
        NSCalendarsFullAccessUsageDescription: "Baseline notices late meetings and packed days so it can see how they affect your sleep and recovery. Nothing leaves your phone."
        NSLocationWhenInUseUsageDescription: "Baseline uses your approximate location once a day to look up overnight temperature, so it can spot hot nights that disturb sleep."
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.dagarwal.baseline.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dagarwal.baseline
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Baseline
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BaselineWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    entitlements:
      path: Widget/BaselineWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.dagarwal.baseline]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Baseline
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dagarwal.baseline.widget
        TARGETED_DEVICE_FAMILY: "1"
