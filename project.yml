name: Baseline
options:
  bundleIdPrefix: com.dagarwal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  Baseline:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
        excludes: [Package.swift, .build]
    entitlements:
      path: App/Baseline.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.healthkit.access: []
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Baseline
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "Baseline reads the sleep, heart rate, workouts and vitals that the Google Health app shares with Apple Health, to score your recovery, strain and sleep on this phone."
        NSHealthUpdateUsageDescription: "Baseline does not write to Apple Health."
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.dagarwal.baseline.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dagarwal.baseline
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Baseline
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
